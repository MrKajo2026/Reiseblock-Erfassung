<!doctype html>
<html lang="de">

<style>
:root{
  --bg:#F5F3EE; --card:#FFFFFF; --ink:#161616; --muted:#7B776F; --line:#E5E1D9; --line2:#D2CDC3;
  --accent:#4E6B5C; --accent-soft:#E7EEE9; --ja:#4E6B5C; --nein:#A8503B; --warn:#8A6A2E; --warn-soft:#F3EBDD;
  --serif:ui-serif,"New York","Iowan Old Style","Palatino",Georgia,serif;
  --sans:-apple-system,"SF Pro Text","Helvetica Neue",Inter,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{max-width:520px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
header.bar{position:sticky;top:0;background:var(--bg);padding:20px 22px 12px;display:flex;align-items:flex-start;gap:10px;z-index:5}
header.bar h1{font-family:var(--serif);font-weight:400;font-size:28px;line-height:1.12;margin:0;flex:1;min-width:0;letter-spacing:-.01em;overflow-wrap:anywhere}
header.bar h1.sm{font-size:22px}
header.bar small{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:5px;font-weight:400;letter-spacing:0}
.back{border:0;background:none;font-size:28px;line-height:1;padding:0 8px 0 0;color:var(--ink);cursor:pointer;margin-top:-2px}
.icon{border:1px solid var(--line2);background:#fff;width:40px;height:40px;border-radius:50%;font:inherit;font-size:18px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.sync{font-size:11px;color:var(--muted);padding:0 22px 6px;text-align:right;letter-spacing:.02em;min-height:16px}
.sync.err{color:var(--nein)}
.sync.warn{color:var(--warn)}
.menu{position:absolute;right:22px;top:66px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:6px;min-width:210px;z-index:10;box-shadow:0 8px 24px rgba(0,0,0,.06)}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:12px 14px;font:inherit;font-size:15px;color:var(--ink);border-radius:10px;cursor:pointer}
.menu button:active{background:var(--bg)}
.menu .sep{height:1px;background:var(--line);margin:4px 8px}
main{padding:4px 22px 120px;flex:1;display:flex;flex-direction:column;gap:18px}
.card{background:var(--card);border-radius:20px;padding:20px}
.tile{background:var(--card);border-radius:22px;padding:20px 20px 16px;cursor:pointer}
.tile .t1{font-family:var(--serif);font-size:23px;line-height:1.15;margin:0 0 5px}
.tile .t2{font-size:13px;color:var(--muted);margin:0 0 12px}
.tile .chips{margin-bottom:12px}
h2{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:500;margin:0 0 12px}
h3{font-family:var(--serif);font-weight:400;font-size:19px;margin:0 0 6px}
p.sub{margin:0 0 12px;font-size:13px;color:var(--muted)}
label.f{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}
.card>label.f:first-child,.card>.ps:first-child,.card>h3:first-child{margin-top:0}
input[type=text],input[type=number],input[type=date],input[type=time],input[type=url],input[type=email],input[type=password],textarea{width:100%;min-height:48px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;font:inherit;background:var(--bg);color:var(--ink);-webkit-appearance:none}
input:focus,textarea:focus{outline:none;border-color:var(--ink)}
textarea{min-height:72px;resize:vertical}
.inl{display:flex;gap:10px}
.inl>*{flex:1;min-width:0}
.inl>.narrow{flex:0 0 110px}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border:1px solid var(--line2);background:#fff;border-radius:999px;font:inherit;font-size:13px;min-height:36px;cursor:pointer;color:var(--ink);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.soft{background:var(--bg);border-color:var(--bg);color:var(--muted);cursor:default}
.chip.add{border-style:dashed;color:var(--muted)}
.chip .k{width:18px;height:18px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-size:11px;font-weight:600;display:inline-flex;align-items:center;justify-content:center}
.chip.on .k{background:#fff;color:var(--ink)}
.seg{display:flex;gap:7px;flex-wrap:wrap}
.seg button{flex:1 1 auto;padding:10px 12px;border:1px solid var(--line2);background:#fff;border-radius:999px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer;min-height:44px}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.seg.again button{font-size:17px;min-height:58px}
.seg.again button.on[data-v=ja]{background:var(--ja);border-color:var(--ja)}
.seg.again button.on[data-v=nein]{background:var(--nein);border-color:var(--nein)}
.rate{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.rate.first{border-top:0;padding-top:0}
.rate .n{font-size:14px;flex:1}
.rate .b{display:flex;gap:4px}
.rate .b button{width:36px;height:36px;border:1px solid var(--line2);background:#fff;border-radius:50%;font:inherit;font-size:13px;cursor:pointer;color:var(--ink)}
.rate .b button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.rate .b button.na{border-style:dashed;color:var(--muted)}
.rate .b button.na.on{background:var(--muted);border-color:var(--muted);color:#fff}
.hint{font-size:12px;color:var(--muted);margin-top:8px}
.timer{font-variant-numeric:tabular-nums;font-size:13px;padding:8px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);flex:0 0 auto;margin-top:4px}
.timer.over{background:var(--warn-soft);color:var(--warn)}
.foot{position:fixed;bottom:0;left:0;right:0;z-index:5}
.foot .in{max-width:520px;margin:0 auto;padding:18px 22px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(rgba(245,243,238,0),var(--bg) 40%);display:flex;gap:8px}
.btn{flex:1;padding:15px;border-radius:999px;border:1px solid var(--ink);background:var(--ink);color:#fff;font:inherit;font-size:15px;font-weight:500;cursor:pointer;min-height:52px}
.btn.ghost{background:#fff;color:var(--ink);border-color:var(--line2)}
.btn.danger{background:#fff;color:var(--nein);border-color:var(--line2)}
.btn.sm{flex:0 0 auto;padding:10px 16px;font-size:14px;min-height:44px}
.btn.inline{width:100%;margin-top:14px;min-height:46px;font-size:14px}
.btn[disabled]{opacity:.5}
.list{display:flex;flex-direction:column;gap:12px}
.stars{color:var(--ink);letter-spacing:1px;font-size:13px}
.stars .dim{color:var(--line2)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 16px;font-size:14px}
.grid div span{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:3px}
.kpi{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi div{padding:12px;background:var(--bg);border-radius:12px}
.kpi b{display:block;font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.kpi div.warn{background:var(--warn-soft)}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:8px 0;border-top:1px solid var(--line)}
tr:first-child td{border-top:0}
td:last-child{text-align:right;font-variant-numeric:tabular-nums}
tr.sum td{font-weight:500}
.empty{color:var(--muted);font-size:14px;padding:6px 0}
details{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
summary{cursor:pointer;font-size:13px;color:var(--muted);list-style:none;display:flex;justify-content:space-between}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";font-size:16px}
details[open] summary::after{content:"–"}
.sl{position:relative;padding-left:34px}
.sl:before{content:"";position:absolute;left:11px;top:10px;bottom:10px;width:2px;background:var(--line2)}
.node{position:relative;margin:4px 0}
.node .dot{position:absolute;left:-30px;top:18px;width:16px;height:16px;border-radius:50%;background:var(--accent);border:3px solid var(--bg)}
.node.end .dot{width:10px;height:10px;background:var(--line2);left:-27px;top:8px;border:0}
.node .box{background:var(--bg);border-radius:16px;padding:14px 16px;cursor:pointer;width:100%;text-align:left;font:inherit;color:var(--ink);border:0;display:block}
.node .box b{font-family:var(--serif);font-weight:400;font-size:19px;display:block}
.node .box span{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.node .txt{font-size:13px;color:var(--muted);padding:6px 0}
.leg{display:flex;align-items:center;gap:12px;padding:10px 0;border:0;background:none;font:inherit;color:var(--ink);text-align:left;cursor:pointer;width:100%}
.leg .ic{width:34px;height:34px;border-radius:50%;background:#fff;border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-left:-39px}
.leg .ic svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.leg .lt{font-size:13px;color:var(--muted)}
.leg .lt b{font-weight:500;color:var(--ink)}
.leg .lt em{font-style:normal;color:var(--warn)}
.arm{display:flex;gap:8px;align-items:flex-start;padding:4px 0 4px 8px;position:relative}
.arm:before{content:"";position:absolute;left:-23px;top:14px;width:22px;height:2px;background:var(--line2)}
.arm .ad{font-size:12px;color:var(--muted);flex:0 0 58px;padding-top:9px}
.arm .chips{flex:1}
.arm .chip{font-size:12px;min-height:32px;padding:6px 11px}
.addleg{font-size:12px;color:var(--accent);background:none;border:0;padding:6px 0 10px 4px;font:inherit;cursor:pointer}
.day{background:var(--card);border-radius:20px;padding:18px 20px}
.day .dh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.day .dh b{font-family:var(--serif);font-weight:400;font-size:20px}
.day .dh span{font-size:12px;color:var(--muted)}
.rowl{display:grid;grid-template-columns:74px 1fr;gap:8px;align-items:start;padding:9px 0;border-top:1px solid var(--line)}
.rowl:first-of-type{border-top:0;padding-top:0}
.rowl .lab{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-top:10px}
.thumbs{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.thumbs img,.thumbs .ph{width:64px;height:64px;object-fit:cover;border-radius:10px;background:var(--bg);display:inline-block}
.file{position:relative;overflow:hidden}
.file input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.ps-res{display:none;background:#fff;border:1px solid var(--line);border-radius:12px;margin-top:6px;overflow:hidden}
.ps-res.show{display:block}
.ps-res button{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:none;padding:11px 14px;font:inherit;font-size:14px;color:var(--ink);cursor:pointer}
.ps-res button:first-child{border-top:0}
.ps-res button small{display:block;font-size:12px;color:var(--muted)}
.picked{font-size:12px;color:var(--accent);margin-top:6px;min-height:14px}
pre.exp{white-space:pre-wrap;word-break:break-word;font-size:12px;background:var(--bg);border-radius:12px;padding:12px;margin:0;max-height:42vh;overflow:auto;user-select:all;-webkit-user-select:all}
.err{color:var(--nein);font-size:13px;margin-top:8px;display:none}
.err.show{display:block}
.banner{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13px}
.task{background:#fff;border-radius:16px;padding:14px 16px}
.task.done{opacity:.5}
.task b{display:block;font-weight:500}
.task p{margin:4px 0 8px;font-size:14px;color:var(--muted);white-space:pre-wrap}
.task .meta{font-size:12px;color:var(--muted);margin-bottom:8px}
.task .meta.due{color:var(--warn)}
.seg.sm button{min-height:34px;padding:6px 10px;font-size:12px}
code{font-size:13px;background:var(--bg);border-radius:6px;padding:1px 6px}
.wide{display:contents}
@media (min-width: 900px){
  #app{max-width:1100px}
  header.bar{padding:28px 32px 12px}
  header.bar h1{font-size:34px}
  .sync{padding-right:32px}
  .menu{right:32px}
  main{padding:4px 32px 120px}
  main.home{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px;align-content:start}
  main.home .list{display:contents}
  main.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-content:start}
  main.two .col{display:flex;flex-direction:column;gap:18px}
  main.days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-content:start}
  main.days .full{grid-column:1/-1}
  main.form{max-width:680px;width:100%;margin:0 auto}
  .foot .in{max-width:680px}
}
</style>

const stopTotal = s => { const p=num(s.price); if(p==null) return null; return s.type==='hotel' ? p*(parseInt(s.nights)||1) : p; };
const stopAvg = s => { const v=Object.values(s.ratings||{}).filter(x=>x>0); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
const avgOf = stops => { const v=stops.map(stopAvg).filter(x=>x!=null); return v.length ? v.reduce((a,b)=>a+b,0)/v.length : null; };
const wegMin = w => w ? (w.manualMin!=null?w.manualMin:w.autoMin) : null;
const wegText = w => { if(!w) return ''; const parts=[w.mode||'', wegMin(w)!=null?hm(wegMin(w))+(w.manualMin!=null&&w.reason?' · '+w.reason:(w.manualMin==null&&w.autoKind==='estimate'?' (geschätzt)':'')):'', w.provider||''].filter(Boolean); return parts.join(' · '); };
function parseDrive(s){ if(!s) return null; const m=String(s).match(/(\d+)\s*[:h]\s*(\d+)?/); if(!m) return null; return parseInt(m[1])*60+(parseInt(m[2])||0); }
function migrate(d){
  if(!d.ext) d.ext={flight:'',transport:'',insurance:'',other:''}; if(!d.etappen) d.etappen=[]; if(!d.fazit) d.fazit={}; if(!d.rueck) d.rueck=newWeg();
  if(d.startLat===undefined) d.startLat=null; if(d.startLng===undefined) d.startLng=null; if(!d.startFrom) d.startFrom=''; if(!d.endTo) d.endTo='';
  d.etappen.forEach(e=>{ if(!e.stops) e.stops=[]; if(e.lat===undefined) e.lat=null; if(e.lng===undefined) e.lng=null; if(!e.address) e.address=''; if(!e.link) e.link='';
    if(!e.weg){ e.weg=newWeg(); e.weg.from=e.von||''; e.weg.mode=e.mode||''; e.weg.manualMin=parseDrive(e.drive); }
    e.stops.forEach(s=>{ if(!s.props) s.props=[]; if(!s.tags) s.tags=[]; if(!s.photos) s.photos=[]; if(!s.ratings) s.ratings={}; if(s.lat===undefined) s.lat=null; });
  });
}
function costs(d){
  let transport=(num(d.ext.flight)||0)+(num(d.ext.transport)||0);
  d.etappen.forEach(e=>{ transport+=(num(e.weg&&e.weg.cost)||0)+(num(e.weg&&e.weg.insurance)||0); });
  transport+=(num(d.rueck&&d.rueck.cost)||0)+(num(d.rueck&&d.rueck.insurance)||0);
  const c={ transport, unterkunft:0, essen:0, aktiv:0, sonstiges:(num(d.ext.insurance)||0)+(num(d.ext.other)||0), missing:0 };
  allStops(d).forEach(s=>{ const v=stopTotal(s); if(v==null){c.missing++;return;} c[TYPES[s.type].cat]+=v; });
  c.gesamt=c.transport+c.unterkunft+c.essen+c.aktiv+c.sonstiges; return c;
}
function tripSummary(d){
  const stops=allStops(d), days=tripDays(d), c=costs(d);
  const rated=stops.filter(s=>stopAvg(s)!=null).length; const avg=rated>=5?avgOf(stops):null;
  const rate=num(d.rate), cur=d.currency||'EUR';
  let perDay=null; if(days.length&&c.gesamt>0){ perDay=c.gesamt/2/days.length; if(cur!=='EUR'){ perDay=rate?perDay*rate:null; } }
  return {stops:stops.length, days:days.length, rated, avg, perDay, level:dayLevel(perDay), c};
}

/* ---------- Synchronisation ---------- */
function setSync(text, cls){ const el=$('#sync'); if(!el) return; el.textContent=text||''; el.className='sync'+(cls?' '+cls:''); }
function mutate(id, fn){ const r=trip(id); if(!r) return; fn(r.data); (pending[id] ||= []).push(fn); setSync('Speichert …'); clearTimeout(flushTimers[id]); flushTimers[id]=setTimeout(()=>flush(id), 700); }
async function flush(id){
  const fns=pending[id]; if(!fns||!fns.length) return; pending[id]=[];
  const r=trip(id); if(!r) return;
  if(!navigator.onLine){ pending[id]=fns.concat(pending[id]); setSync('Offline – wird gespeichert, sobald Verbindung da ist','warn'); return; }
  for(let attempt=0; attempt<3; attempt++){
    const {data,error}=await sb.from('reisen').update({data:r.data, version:r.version+1, updated_at:new Date().toISOString(), updated_by:user.id}).eq('id',id).eq('version',r.version).select('version');
    if(error){ pending[id]=fns.concat(pending[id]); setSync('Speichern fehlgeschlagen: '+error.message,'err'); return; }
    if(data&&data.length){ r.version=data[0].version; setSync(pending[id].length?'Speichert …':'Gespeichert'); return; }
    const fresh=await sb.from('reisen').select('data,version').eq('id',id).single();
    if(fresh.error||!fresh.data){ pending[id]=fns.concat(pending[id]); setSync('Reise nicht mehr vorhanden','err'); return; }
    r.data=fresh.data.data; migrate(r.data); r.version=fresh.data.version; fns.forEach(f=>f(r.data));
    setSync('Zusammengeführt','warn');
    if(view.tripId===id && !['stop','etEdit','tripEdit','rueckEdit'].includes(view.name)) render();
  }
  pending[id]=fns.concat(pending[id]); setSync('Konflikt – Seite neu laden','err');
}
function flushAll(){ Object.keys(pending).forEach(id=>{ clearTimeout(flushTimers[id]); flush(id); }); }
function scheduleFeedback(){ clearTimeout(feedbackTimer); setSync('Speichert …'); feedbackTimer=setTimeout(async()=>{ const {error}=await sb.from('kv').upsert({key:'feedback', data:feedback, updated_at:new Date().toISOString()}); setSync(error?'Nicht gespeichert: '+error.message:'Gespeichert', error?'err':''); },800); }
async function loadAll(){
  loaded=true;
  const [r1,r2,r3]=await Promise.all([ sb.from('reisen').select('id,data,version').order('updated_at',{ascending:false}), sb.from('aufgaben').select('*').order('created_at'), sb.from('kv').select('data').eq('key','feedback').maybeSingle() ]);
  if(r1.error){ view={name:'login', msg:'Daten konnten nicht geladen werden: '+r1.error.message}; render(); return; }
  trips=r1.data||[]; tasks=r2.data||[]; feedback=(r3.data&&r3.data.data)||{use:'',missing:'',annoying:''};
  trips.forEach(t=>migrate(t.data));
  subscribe(); go({name:'home'}); setSync('Gespeichert');
}
function subscribe(){
  if(channel) return;
  channel=sb.channel('reisen-sync').on('postgres_changes',{event:'*',schema:'public',table:'reisen'},p=>{
    if(p.eventType==='INSERT'){ if(!trip(p.new.id)){ migrate(p.new.data); trips.unshift({id:p.new.id,data:p.new.data,version:p.new.version}); if(view.name==='home') render(); } }
    else if(p.eventType==='UPDATE'){ const r=trip(p.new.id); if(r && !(pending[r.id]&&pending[r.id].length) && p.new.version>r.version){ r.data=p.new.data; migrate(r.data); r.version=p.new.version; if(view.tripId===r.id && !['stop','etEdit','tripEdit','rueckEdit'].includes(view.name)) render(); setSync('Aktualisiert','warn'); } }
    else if(p.eventType==='DELETE'){ trips=trips.filter(x=>x.id!==p.old.id); if(view.tripId===p.old.id) go({name:'home'}); else if(view.name==='home') render(); }
  }).subscribe();
}
/* Fotos */
function resizeImage(file,max=1600,q=0.82){ return new Promise((res,rej)=>{ const img=new Image(); const url=URL.createObjectURL(file); img.onload=()=>{ let w=img.naturalWidth,h=img.naturalHeight; const s=Math.min(1,max/Math.max(w,h)); w=Math.round(w*s); h=Math.round(h*s); const c=document.createElement('canvas'); c.width=w; c.height=h; c.getContext('2d').drawImage(img,0,0,w,h); c.toBlob(b=>{ URL.revokeObjectURL(url); b?res(b):rej(new Error('Bild konnte nicht verarbeitet werden')); },'image/jpeg',q); }; img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Bild nicht lesbar')); }; img.src=url; }); }
async function addPhotos(files){
  let failed=false;
  for(const f of files){ try{ setSync('Foto wird hochgeladen …'); const blob=await resizeImage(f); const path=`${view.tripId}/${draft.id}/${uid()}.jpg`; const {error}=await sb.storage.from('fotos').upload(path, blob, {contentType:'image/jpeg', upsert:false}); if(error) throw error; draft.photos.push({path, name:f.name}); }catch(e){ failed=true; setSync('Foto fehlgeschlagen: '+(e.message||e),'err'); } }
  if(!failed) setSync('Fotos hochgeladen','warn'); await renderThumbs();
}
async function signed(paths){ const missing=paths.filter(p=>!signedCache[p]); if(missing.length){ const {data}=await sb.storage.from('fotos').createSignedUrls(missing,3600); (data||[]).forEach(x=>{ if(x.signedUrl) signedCache[x.path]=x.signedUrl; }); } return paths.map(p=>signedCache[p]); }
async function renderThumbs(){ const el=$('#thumbs'); if(!el||!draft) return; if(!draft.photos.length){ el.innerHTML=''; return; } const urls=await signed(draft.photos.map(p=>p.path)); const el2=$('#thumbs'); if(el2) el2.innerHTML=urls.map(u=>u?`<img src="${u}" alt="">`:`<span class="ph"></span>`).join(''); }
/* Ortssuche (OpenStreetMap / Photon) */
async function searchPlace(q,bias){
  let url='https://photon.komoot.io/api/?q='+encodeURIComponent(q)+'&limit=5&lang=de';
  if(bias&&bias.lat!=null) url+='&lat='+bias.lat+'&lon='+bias.lng;
  const r=await fetch(url); const j=await r.json();
  return (j.features||[]).map(f=>{ const p=f.properties||{}; const [lng,lat]=f.geometry.coordinates; const name=p.name||[p.street,p.housenumber].filter(Boolean).join(' ')||''; const addr=[[p.street,p.housenumber].filter(Boolean).join(' '), [p.postcode,p.city||p.town||p.village].filter(Boolean).join(' '), p.country].filter(Boolean).join(', '); return {name, addr, lat, lng}; });
}

/* Reisezeit */
async function computeLeg(w, to){
  if(w.fromLat==null||!to||to.lat==null) return null;
  const km=haversine({lat:w.fromLat,lng:w.fromLng},{lat:to.lat,lng:to.lng}); const m=w.mode;
  if(m==='Auto'||m==='Mietwagen'){
    try{ const ctl=new AbortController(); const tm=setTimeout(()=>ctl.abort(),7000); const r=await fetch(`https://router.project-osrm.org/route/v1/driving/${w.fromLng},${w.fromLat};${to.lng},${to.lat}?overview=false`,{signal:ctl.signal}); clearTimeout(tm); const j=await r.json(); if(j.routes&&j.routes[0]) return {min:Math.round(j.routes[0].duration/60), km:Math.round(j.routes[0].distance/1000), kind:'route'}; }catch(e){}
    return {min:Math.round(km*1.3/80*60), km:Math.round(km*1.3), kind:'estimate'};
  }
  const speed={Bahn:80,Flug:750,'Fähre':35,Boot:35,Fahrrad:18,'zu Fuß':4.5}[m]||60; const fixed={Flug:150,Bahn:20,'Fähre':30,Boot:30}[m]||0; const f=m==='Flug'?1.05:1.25;
  return {min:Math.round(km*f/speed*60+fixed), km:Math.round(km*f), kind:'estimate'};
}

function rohdaten(){

  root.querySelectorAll('[data-bind]').forEach(el=>{
    const parts=el.dataset.bind.split('.'); const o=parts[0]; let obj=null, k=parts[1];
    if(o==='fb') obj=feedback; else if(o==='td') obj=tripDraft; else if(o==='tdext') obj=tripDraft&&tripDraft.ext; else if(o==='ed') obj=etDraft; else if(o==='sd') obj=draft; else if(o==='tk') obj=taskDraft; else if(o==='wg') obj=wegDraft;
    else if(o==='fz'){ const t=trip(view.tripId); obj=t&&fazitFor(t.data,parts[1]); k=parts[2]; }
    if(!obj) return;
    if(o==='wg'&&k==='manualTime'){ el.value=toTime(obj.manualMin); el.addEventListener('input',()=>{ obj.manualMin=fromTime(el.value); const h=$('#legHint'); if(h) h.textContent=(obj.autoMin!=null?`Berechnet: ${hm(obj.autoMin)} · ${obj.autoKm} km${obj.autoKind==='estimate'?' (Schätzung)':''}`:'')+(obj.manualMin!=null?' · manuell '+hm(obj.manualMin):''); }); return; }
    el.value=obj[k]??'';
    el.addEventListener('input',()=>{ const v=el.value;
      if(o==='fz'){ const date=parts[1], id=view.tripId; mutate(id, d=>{ fazitFor(d,date)[k]=v; }); } else { obj[k]=v; if(o==='fb') scheduleFeedback(); }
      if(el.dataset.after==='price'){ const h=$('#priceHint'); if(h) h.textContent=priceHint(); } });
  });
  psBind(root);
  const ph=root.querySelector('#photos'); if(ph) ph.addEventListener('change',e=>{ const files=[...e.target.files]; e.target.value=''; addPhotos(files); });
}
function tick(){ const el=$('#timer'); if(!el) return; const s=Math.floor((Date.now()-timer.start)/1000); el.textContent=mmss(s); el.classList.toggle('over',s>120); }
function render(){
  const app=$('#app'); let html=''; const t=view.tripId&&trip(view.tripId); const e=t&&view.etId&&etappeOf(t.data,view.etId);
  if(view.name!=='login'&&view.name!=='config'&&!user){ view={name:'login'}; }
  switch(view.name){
    case 'config': html=vConfig(); break; case 'login': html=vLogin(); break; case 'home': html=vHome(); break;
    case 'tripEdit': html=vTripEdit(); break; case 'trip': html=t?vTrip(t):vHome(); break; case 'etEdit': html=vEtEdit(); break; case 'rueckEdit': html=vRueckEdit(); break;
    case 'etappe': html=(t&&e)?vEtappe(t,e):vHome(); break; case 'stop': html=vStop(); break;
    case 'tasks': html=vTasks(); break; case 'feedback': html=vFeedback(); break; case 'export': html=vExport(); break;
  }
  app.innerHTML=html; bind(app);
  const anyPending=Object.values(pending).some(a=>a&&a.length); setSync(anyPending?'Speichert …':(user?'Gespeichert':''));
  if(view.name==='stop'){ if(draft.isNew){ if(!timer.iv) timer.iv=setInterval(tick,1000); tick(); } renderThumbs(); }
}
function segToggle(btn,single=true){ if(single){ [...btn.parentElement.children].forEach(b=>b.classList.remove('on')); btn.classList.add('on'); } else btn.classList.toggle('on'); }
function legHint(){ const w=wegDraft; const h=$('#legHint'); if(!h||!w) return; h.textContent=(w.autoMin!=null?`Berechnet: ${hm(w.autoMin)} · ${w.autoKm} km${w.autoKind==='estimate'?' (Schätzung)':''}`:'Berechnung braucht Koordinaten von Start und Ziel.')+(w.manualMin!=null?' · manuell '+hm(w.manualMin):''); }

/* ---------- Actions ---------- */
const actions={
  async login(){ const email=$('#email').value.trim(), password=$('#pw').value; const e=$('#errLogin'); e.classList.remove('show'); const {error}=await sb.auth.signInWithPassword({email,password}); if(error){ e.textContent='Anmeldung fehlgeschlagen: '+error.message; e.classList.add('show'); } },
  async logout(){ flushAll(); await sb.auth.signOut(); },
  menu(){ menuOpen=!menuOpen; render(); },
  home(){ go({name:'home'}); }, export(){ go({name:'export'}); }, feedback(){ go({name:'feedback'}); },
  tasks(){ if(!taskDraft) taskDraft=newTask(''); go({name:'tasks', returnTo:{...view}}); },
  note(){ taskDraft=newTask(screenLabel()); go({name:'tasks', returnTo:{...view}}); },
  tasksBack(){ const r=view.returnTo||{name:'home'}; go(r.name==='tasks'?{name:'home'}:r); },
  taskFilter(d){ view.filter=d.v; render(); },
  async saveTask(){ if(!taskDraft.title.trim()){ $('#errTask').classList.add('show'); return; } setSync('Speichert …'); const {data,error}=await sb.from('aufgaben').insert({title:taskDraft.title.trim(), text:taskDraft.text||'', status:'offen', due:taskDraft.due||null, source:taskDraft.source||''}).select('*').single(); if(error){ setSync('Nicht gespeichert: '+error.message,'err'); return; } tasks.push(data); taskDraft=newTask(''); render(); window.scrollTo(0,0); },
  async setTaskStatus(d){ const x=tasks.find(t=>t.id===d.id); if(!x) return; const old=x.status; x.status=d.v; render(); const {error}=await sb.from('aufgaben').update({status:d.v, updated_at:new Date().toISOString()}).eq('id',d.id); if(error){ x.status=old; setSync('Nicht gespeichert','err'); render(); } },
  async delTask(d){ const {error}=await sb.from('aufgaben').delete().eq('id',d.id); if(error){ setSync('Löschen fehlgeschlagen','err'); return; } tasks=tasks.filter(t=>t.id!==d.id); render(); },
  newTrip(){ tripDraft=newTripData(); editingTripId=null; go({name:'tripEdit'}); },
  editTrip(){ const t=trip(view.tripId); tripDraft=clone(t.data); editingTripId=t.id; go({name:'tripEdit',tripId:t.id}); },
  backToTrip(){ go({name:'trip',tripId:view.tripId||editingTripId}); },
  setCat(d,b){ tripDraft.category=d.v; segToggle(b); },
  async saveTrip(){
    if(!tripDraft.title.trim()){ $('#errTrip').classList.add('show'); return; }
    tripDraft.currency=(tripDraft.currency||'EUR').toUpperCase();
    if(editingTripId){ const val=clone(tripDraft); mutate(editingTripId, d=>{ ['title','countries','category','from','to','currency','rate','ext','startFrom','startLat','startLng','endTo'].forEach(k=>{ d[k]=clone(val[k]); }); }); go({name:'trip',tripId:editingTripId}); return; }
    const btn=$('#btnSaveTrip'); btn.disabled=true; setSync('Speichert …');
    const {data,error}=await sb.from('reisen').insert({data:tripDraft, updated_by:user.id}).select('id,data,version').single();
    if(error){ btn.disabled=false; setSync('Nicht gespeichert: '+error.message,'err'); return; }
    if(!trip(data.id)) trips.unshift(data); go({name:'trip',tripId:data.id});
  },
  openTrip(d){ go({name:'trip',tripId:d.id}); },
  newEtappe(d){ const t=trip(view.tripId); const i=parseInt(d.i); etDraft=newEtappe(t.data,i); etDraft._insertAt=i; wegDraft=etDraft.weg; go({name:'etEdit',tripId:view.tripId}); },
  editEtappe(d){ const id=d.id||view.etId; etDraft=clone(etappeOf(trip(view.tripId).data,id)); wegDraft=etDraft.weg; go({name:'etEdit',tripId:view.tripId,etId:id}); },
  editRueck(){ const t=trip(view.tripId); wegDraft=clone(t.data.rueck||newWeg()); if(!wegDraft.from&&t.data.etappen.length){ const l=t.data.etappen[t.data.etappen.length-1]; wegDraft.from=l.ort; wegDraft.fromLat=l.lat; wegDraft.fromLng=l.lng; } go({name:'rueckEdit',tripId:view.tripId}); },
  setMode(d,b){ wegDraft.mode=d.v; wegDraft.autoMin=null; wegDraft.autoKind=''; segToggle(b); render(); },
  setReason(d,b){ wegDraft.reason=wegDraft.reason===d.v?'':d.v; [...b.parentElement.children].forEach(x=>x.classList.remove('on')); if(wegDraft.reason) b.classList.add('on'); },
  rateLeg(d,b){ wegDraft.rating=parseInt(d.v); segToggle(b); },
  async calcLeg(){ const t=trip(view.tripId); let to=null; if(view.name==='etEdit') to={lat:etDraft.lat,lng:etDraft.lng}; else to={lat:t.data.startLat,lng:t.data.startLng}; setSync('Berechnet …'); const r=await computeLeg(wegDraft,to); if(r){ wegDraft.autoMin=r.min; wegDraft.autoKm=r.km; wegDraft.autoKind=r.kind; setSync('Gespeichert'); } else setSync('Berechnung nicht möglich – Koordinaten fehlen','warn'); legHint(); },
  async saveEtappe(){ if(!etDraft.ort.trim()||!etDraft.arrive){ $('#errEt').classList.add('show'); return; }
    if(etDraft.weg.autoMin==null&&etDraft.weg.mode&&etDraft.weg.fromLat!=null&&etDraft.lat!=null){ setSync('Berechnet …'); const r=await computeLeg(etDraft.weg,{lat:etDraft.lat,lng:etDraft.lng}); if(r){ etDraft.weg.autoMin=r.min; etDraft.weg.autoKm=r.km; etDraft.weg.autoKind=r.kind; } }
    const at=etDraft._insertAt; delete etDraft._insertAt; const val=clone(etDraft);
    mutate(view.tripId, d=>{ const i=d.etappen.findIndex(e=>e.id===val.id); if(i>=0){ const keep=d.etappen[i].stops; d.etappen[i]=clone(val); d.etappen[i].stops=keep; } else { const idx=(at!=null&&at<=d.etappen.length)?at:d.etappen.length; d.etappen.splice(idx,0,clone(val)); } });
    wegDraft=null; go({name:'etappe',tripId:view.tripId,etId:val.id}); },
  async saveRueck(){ const t=trip(view.tripId); if(wegDraft.autoMin==null&&wegDraft.mode&&wegDraft.fromLat!=null&&t.data.startLat!=null){ setSync('Berechnet …'); const r=await computeLeg(wegDraft,{lat:t.data.startLat,lng:t.data.startLng}); if(r){ wegDraft.autoMin=r.min; wegDraft.autoKm=r.km; wegDraft.autoKind=r.kind; } } const val=clone(wegDraft); mutate(view.tripId, d=>{ d.rueck=clone(val); }); wegDraft=null; go({name:'trip',tripId:view.tripId}); },
  delEtappe(){ const id=etDraft.id; mutate(view.tripId, d=>{ d.etappen=d.etappen.filter(e=>e.id!==id); }); etDraft=null; wegDraft=null; go({name:'trip',tripId:view.tripId}); },
  openEtappe(d){ go({name:'etappe',tripId:view.tripId,etId:d.id}); },
  backToEtappe(){ go({name:'etappe',tripId:view.tripId,etId:view.etId}); },
  setFeas(d,b){ const date=d.d, v=d.v; mutate(view.tripId, x=>{ fazitFor(x,date).feas=v; }); segToggle(b); },
  setMove(d,b){ const date=d.d, v=d.v; mutate(view.tripId, x=>{ fazitFor(x,date).move=v; }); segToggle(b); },
  setUse(d,b){ feedback.use=d.v; segToggle(b); scheduleFeedback(); },
  newStop(d){ draft=newStop(d.d, d.t||''); if(d.t){ TYPES[d.t].crit.forEach(c=>{ draft.ratings[c]=TYPES[d.t].na.includes(c)?0:3; }); } timer.start=Date.now(); go({name:'stop',tripId:view.tripId,etId:view.etId,date:d.d}); },
  newStopIn(d){ view.etId=d.et; actions.newStop({d:d.d}); },
  editStopIn(d){ view.etId=d.et; actions.editStop({id:d.id}); },
  editStop(d){ const s=etappeOf(trip(view.tripId).data,view.etId).stops.find(x=>x.id===d.id); draft=clone(s); go({name:'stop',tripId:view.tripId,etId:view.etId,date:s.date}); },
  cancelStop(){ draft=null; go({name:'etappe',tripId:view.tripId,etId:view.etId}); },
  setType(d,b){ draft.type=d.v; segToggle(b); const T=TYPES[d.v]; T.crit.forEach(c=>{ if(draft.ratings[c]===undefined) draft.ratings[c]=T.na.includes(c)?0:3; }); $('#crit').innerHTML=critHTML(); $('#priceLabel').textContent=T.priceLabel; $('#nightsWrap').style.display=d.v==='hotel'?'':'none'; $('#propsCard').style.display=d.v==='hotel'?'':'none'; $('#tagsCard').style.display=d.v==='hotel'?'none':''; $('#priceHint').textContent=priceHint(); },
  setAgain(d,b){ draft.again=d.v; segToggle(b); },
  rate(d,b){ draft.ratings[d.c]=parseInt(d.v); segToggle(b); },
  toggleTag(d,b){ const a=draft.tags,i=a.indexOf(d.v); i>=0?a.splice(i,1):a.push(d.v); segToggle(b,false); },
  toggleProp(d,b){ const a=draft.props,i=a.indexOf(d.v); i>=0?a.splice(i,1):a.push(d.v); segToggle(b,false); },
  pick(d){ const x=(psResults[d.ps]||[])[parseInt(d.i)]; if(x) psPick(d.ps,x); },
  saveStop(){
    const err=$('#errStop'); const miss=[];
    if(!draft.type) miss.push('Typ'); if(!draft.name.trim()) miss.push('Name'); if(!draft.again) miss.push('Wieder?');
    if(miss.length){ err.textContent='Fehlt: '+miss.join(', ')+'.'; err.classList.add('show'); return; }
    if(draft.isNew){ draft.seconds=Math.floor((Date.now()-timer.start)/1000); delete draft.isNew; }
    const val=clone(draft), etId=view.etId;
    mutate(view.tripId, d=>{ const e=etappeOf(d,etId); if(!e) return; const i=e.stops.findIndex(s=>s.id===val.id); if(i>=0) e.stops[i]=clone(val); else e.stops.push(clone(val)); });
    draft=null; go({name:'etappe',tripId:view.tripId,etId:view.etId});
  },
  delStop(){ const id=draft.id, etId=view.etId; mutate(view.tripId, d=>{ const e=etappeOf(d,etId); if(e) e.stops=e.stops.filter(s=>s.id!==id); }); draft=null; go({name:'etappe',tripId:view.tripId,etId:view.etId}); }
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');
  if(menuOpen && !e.target.closest('#menu') && !(b&&b.dataset.act==='menu')){ menuOpen=false; const m=$('#menu'); if(m) m.remove(); }
  if(!e.target.closest('.ps')){ document.querySelectorAll('.ps-res.show').forEach(x=>x.classList.remove('show')); }
  if(!b) return; const a=actions[b.dataset.act]; if(a) a(b.dataset,b);
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&view.name==='login'&&(e.target.id==='email'||e.target.id==='pw')) actions.login(); });
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') flushAll(); });
window.addEventListener('online',flushAll);

/* ---------- Start ---------- */
(async function boot(){
  if(!window.supabase){ $('#app').innerHTML=`<main><div class="banner">Die Datei <code>supabase.js</code> fehlt im Repo neben <code>reise.html</code>.</div></main>`; return; }
  if(SUPABASE_URL.startsWith('HIER')||SUPABASE_ANON_KEY.startsWith('HIER')){ view={name:'config'}; render(); return; }
  sb=supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev,session)=>{ const u=session?session.user:null; if(u){ user=u; if(!loaded) loadAll(); } else { user=null; loaded=false; trips=[]; tasks=[]; if(channel){ sb.removeChannel(channel); channel=null; } view={name:'login'}; render(); } });
  const {data}=await sb.auth.getSession(); user=data&&data.session?data.session.user:null;
  if(user){ if(!loaded) await loadAll(); } else { view={name:'login'}; render(); }
})();
</script>
